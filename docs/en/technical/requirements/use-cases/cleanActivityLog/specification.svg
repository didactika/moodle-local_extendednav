<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:506px;height:628px;background:#FFFFFF;" width="506px" height="628px" viewBox="0 0 506 628" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="104"><text x="124.855" y="32.995" fill="#0F172A" font-size="14" textLength="254.591" font-weight="700" font-family="IBM Plex Sans">UC-010 Clean up the activity log</text></g><ellipse cx="237.651" cy="62.297" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="27.659" y="92.297" width="419.984" height="36.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="37.659" y="115.292" fill="#0F172A" font-size="14" textLength="399.984" font-family="IBM Plex Sans">An administrator turns on the clean-up and sets the time</text><rect x="153.44" y="148.594" width="168.422" height="36.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="163.44" y="171.589" fill="#0F172A" font-size="14" textLength="148.422" font-family="IBM Plex Sans">The task is turned on</text><rect x="135.085" y="204.891" width="205.131" height="36.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="145.085" y="227.886" fill="#0F172A" font-size="14" textLength="185.131" font-family="IBM Plex Sans">Once a day the task starts</text><rect x="110.035" y="261.188" width="255.231" height="36.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="120.035" y="284.183" fill="#0F172A" font-size="14" textLength="235.231" font-family="IBM Plex Sans">Read where the log is clean up to</text><rect x="16" y="373.781" width="443.302" height="36.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="26" y="396.776" fill="#0F172A" font-size="14" textLength="423.302" font-family="IBM Plex Sans">Read the ids of the entries of the plugin, a thousand at once</text><rect x="142.513" y="430.078" width="190.276" height="36.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="152.513" y="453.073" fill="#0F172A" font-size="14" textLength="170.276" font-family="IBM Plex Sans">Delete them by their ids</text><rect x="138.606" y="486.375" width="198.09" height="36.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="148.606" y="509.37" fill="#0F172A" font-size="14" textLength="178.09" font-family="IBM Plex Sans">Write down how far it got</text><rect x="144.792" y="317.484" width="185.717" height="36.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="154.792" y="340.479" fill="#0F172A" font-size="14" textLength="165.717" font-family="IBM Plex Sans">Take one day of the log</text><polygon points="100.074,542.672,375.228,542.672,387.228,554.672,375.228,566.672,100.074,566.672,88.074,554.672,100.074,542.672" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="100.074" y="559.519" fill="#0F172A" font-size="14" textLength="275.153" font-family="IBM Plex Sans">Older than the time kept and time left?</text><text x="387.228" y="551.842" fill="#0F172A" font-size="12" textLength="20.736" font-family="IBM Plex Sans">yes</text><ellipse cx="237.651" cy="597.672" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="237.651" cy="597.672" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="237.651" y1="72.297" x2="237.651" y2="92.297" style="stroke:#475569;stroke-width:1;"/><polygon points="233.651,82.297,237.651,92.297,241.651,82.297,237.651,86.297" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="237.651" y1="128.594" x2="237.651" y2="148.594" style="stroke:#475569;stroke-widt