<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:529px;height:628px;background:#FFFFFF;" width="529px" height="628px" viewBox="0 0 529 628" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="104"><text x="106.563" y="32.995" fill="#0F172A" font-size="14" textLength="314.638" font-weight="700" font-family="IBM Plex Sans">UC-010 Depurar el registro de actividad</text></g><ellipse cx="249.381" cy="62.297" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="27.402" y="92.297" width="443.958" height="36.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="37.402" y="115.292" fill="#0F172A" font-size="14" textLength="423.958" font-family="IBM Plex Sans">Un administrador activa la depuración y establece el tiempo</text><rect x="176.795" y="148.594" width="145.173" height="36.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="186.795" y="171.589" fill="#0F172A" font-size="14" textLength="125.173" font-family="IBM Plex Sans">La tarea se activa</text><rect x="129.815" y="204.891" width="239.133" height="36.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="139.815" y="227.886" fill="#0F172A" font-size="14" textLength="219.133" font-family="IBM Plex Sans">Una vez al día la tarea se inicia</text><rect x="87.432" y="261.188" width="323.898" height="36.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="97.432" y="284.183" fill="#0F172A" font-size="14" textLength="303.898" font-family="IBM Plex Sans">Leer hasta dónde está depurado el registro</text><rect x="16" y="373.781" width="466.763" height="36.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="26" y="396.776" fil