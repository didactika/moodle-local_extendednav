<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:856px;height:537px;background:#FFFFFF;" width="856px" height="537px" viewBox="0 0 856 537" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="104"><text x="254.423" y="32.995" fill="#0F172A" font-size="14" textLength="345.304" font-weight="700" font-family="IBM Plex Sans">UC-009 Organizar la página de preferencias</text></g><ellipse cx="412.575" cy="62.297" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="231.807" y="92.297" width="361.537" height="36.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="241.807" y="115.292" fill="#0F172A" font-size="14" textLength="341.537" font-family="IBM Plex Sans">El usuario selecciona Organizar mis preferencias</text><rect x="83.279" y="148.594" width="658.593" height="36.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="93.279" y="171.589" fill="#0F172A" font-size="14" textLength="638.593" font-family="IBM Plex Sans">La página Navegación se abre en el contexto del usuario, con las secciones como carpetas</text><polygon points="120.302,261.188,275.115,261.188,287.115,273.188,275.115,285.188,120.302,285.188,108.302,273.188,120.302,261.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="201.708" y="296.326" fill="#0F172A" font-size="12" textLength="104.051" font-family="IBM Plex Sans">ocultar o mostrar</text><text x="120.302" y="278.034" fill="#0F172A" font-size="14" textLength="154.813" font-family="IBM Plex Sans">¿Qué hace el usuario?</text><rect x="16" y="319.156" width="363.417" height="36.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="26" y="342.151" fill="#0F172A" font-size="14" textLength="343.417" font-family="IBM Plex Sans">El cambio se guarda como excepción del usuario</text><polygon points="461.052,261.188,578.405,261.188,590.405,273.188,578.405,285.188,461.052,285.188,449.052,273.188,461.052,261.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="461.052" y="278.034" fill="#0F172A" font-size="14" textLength="117.353" font-family="IBM Plex Sans">ordenar o mover</text><text x="590.405" y="270.357" fill="#0F172A" font-size="12" textLength="63.791" font-family="IBM Plex Sans">renombrar</text><rect x="399.417" y="305.188" width="240.623" height="36.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="409.417" y="328.183" fill="#0F172A" font-size="14" textLength="220.623" font-family="IBM Plex Sans">Se guarda el orden o la sección</text><rect x="660.04" y="315.172" width="149.11" height="36.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="670.04" y="338.167" fill="#0F172A" font-size="14" textLength="129.11" font-family="IBM Plex Sans">Se guarda el título</text><rect x="305.997" y="204.891" width="213.156" height="36.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="315.997" y="227.886" fill="#0F172A" font-size="14" textLength="193.156" font-family="IBM Plex Sans">El usuario abre una sección</text><polygon points="372.705,395.453,452.446,395.453,464.446,407.453,452.446,419.453,372.705,419.453,360.705,407.453,372.705,395.453" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="372.705" y="412.3" fill="#0F172A" font-size="14" textLength="79.741" font-family="IBM Plex Sans">¿Algo más?</text><text x="464.446" y="404.623" fill="#0F172A" font-size="12" textLength="9.586" font-family="IBM Plex Sans">sí</text><rect x="231.205" y="439.453" width="362.74" height="36.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="4" ry="4"/><text x="241.205" y="462.448" fill="#0F172A" font-size="14" textLength="342.74" font-family="IBM Plex Sans">Preferencias muestra la organización del usuario</text><ellipse cx="412.575" cy="506.75" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="412.575" cy="506.75" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="412.575" y1="72.297" x2="412.575" y2="92.297" style="stroke:#475569;stroke-width:1;"/><polygon points="408.575,82.297,412.575,92.297,416.575,82.297,412.575,86.297" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="412.575" y1="128.594" x2="412.575" y2="148.594" style="stroke:#475569;stroke-width:1;"/><polygon points="408.575,138.594,412.575,148.594,416.575,138.594,412.575,142.594" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="197.708" y1="285.188" x2="197.708" y2="319.156" style="stroke:#475569;stroke-width:1;"/><polygon points="193.708,309.156,197.708,319.156,201.708,309.156,197.708,313.156" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="197.708" y1="355.453" x2="197.708" y2="375.453" style="stroke:#475569;stroke-width:1;"/><polygon points="193.708,365.453,197.708,375.453,201.708,365.453,197.708,369.453" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="519.729" y1="285.188" x2="519.729" y2="305.188" style="stroke:#475569;stroke-width:1;"/><polygon points="515.729,295.188,519.729,305.188,523.729,295.188,519.729,299.188" fill="#475569" style="stroke:#475569;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="519.729" y1="341.484" x2="519.729" y2="375.453" style="stroke:#475569;stroke-width:1;"/><polygon points="515.729,365.453,519.729,375.453,523.729,365.453,519.729,369.453" fill="#475569" style="stroke:#475569;stroke-width:1